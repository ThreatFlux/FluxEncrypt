[workspace]
resolver = "3"
members = [
    "fluxencrypt",
    "fluxencrypt-cli",
    "fluxencrypt-async"
]

[workspace.package]
version = "0.7.5"
authors = ["Wyatt Roersma", "Claude Code", "Codex"]
license = "MIT"
edition = "2024"
repository = "https://github.com/ThreatFlux/fluxencrypt"
homepage = "https://github.com/ThreatFlux/fluxencrypt"
documentation = "https://docs.rs/fluxencrypt"
keywords = ["encryption", "cryptography", "security", "aes", "rsa"]
categories = ["cryptography", "command-line-utilities"]
rust-version = "1.97.1"

[workspace.dependencies]
# Core cryptography
ring = "0.17.14"
# rsa 0.9.x is the latest *stable* release line; 0.10 is still a release candidate.
# Its public API is built on pkcs8 0.10, digest/sha2 0.10 and rand_core 0.6, so the
# three crates below stay on those lines until rsa 0.10 ships stable.
rsa = "0.9.10"
pkcs8 = { version = "0.10.2", features = ["pkcs5", "encryption", "pem"] }
sha2 = "0.10.9"
zeroize = { version = "1.9.0", features = ["derive"] }

# Encoding and serialization
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"

# Performance and concurrency
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.33"

# CLI utilities
clap = { version = "4.6.6", features = ["derive", "cargo"] }
indicatif = "0.18.6"
colored = "3.1.1"
dialoguer = "0.12.0"

# Logging
env_logger = "0.11.11"
log = "0.4.33"

# Testing
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
hex = "0.4.3"

# Development utilities
tempfile = "3.27.0"
# Held at 0.8 by rsa 0.9 (rand_core 0.6 / CryptoRngCore); see note above.
rand = "0.8.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
debug = true
