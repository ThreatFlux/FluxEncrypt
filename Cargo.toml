[workspace]
resolver = "3"
members = [
    "fluxencrypt",
    "fluxencrypt-cli",
    "fluxencrypt-async"
]

[workspace.package]
version = "0.7.9"
authors = ["Wyatt Roersma", "Claude Code", "Codex"]
license = "MIT"
edition = "2024"
repository = "https://github.com/ThreatFlux/fluxencrypt"
homepage = "https://github.com/ThreatFlux/fluxencrypt"
documentation = "https://docs.rs/fluxencrypt"
keywords = ["encryption", "cryptography", "security", "aes", "rsa"]
categories = ["cryptography", "command-line-utilities"]
rust-version = "1.97.1"

[workspace.dependencies]
# Core cryptography
ring = "0.17.14"
# Private RSA operations use AWS-LC; rsa remains for public/key-format compatibility.
aws-lc-rs = "1.18.2"
# Current stable RSA retains public/key-format compatibility. Its required
# PKCS#8/digest/RNG traits are accessed through reexports, not redundant legacy
# direct dependencies. Private RSA operations use the AWS-LC backend above.
rsa = { version = "0.9.10", features = ["pkcs5", "sha2", "getrandom"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# Encoding and serialization
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Performance and concurrency
rayon = "1.12.0"
tokio = { version = "1.54.0", features = ["full"] }
futures = "0.3.34"

# CLI utilities
clap = { version = "4.6.7", features = ["derive", "cargo"] }
indicatif = "0.18.6"
colored = "3.1.1"
dialoguer = "0.12.0"

# Logging
env_logger = "0.11.11"
log = "0.4.34"

# Testing
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.12.0"
hex = "0.4.3"

# Development utilities
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
debug = true
