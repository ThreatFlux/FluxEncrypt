name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: '30 5 * * 2'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read  # Lets CodeQL read workflow run metadata.
      contents: read
      security-events: write  # Uploads the analysis to code scanning.

    strategy:
      fail-fast: false
      matrix:
        # actions analyzes the workflow files themselves.
        language: ['rust', 'actions']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Install Rust
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # v1
      with:
        toolchain: 1.99.0

    - name: Cache dependencies
      if: matrix.language == 'rust'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.99.0-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      if: matrix.language == 'rust'
      run: cargo build --locked --workspace --all-features

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
      with:
        category: "/language:${{matrix.language}}"
