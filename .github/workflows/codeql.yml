name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: '30 5 * * 2'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read  # Lets CodeQL read workflow run metadata.
      contents: read
      security-events: write  # Uploads the analysis to code scanning.

    strategy:
      fail-fast: false
      matrix:
        # actions analyzes the workflow files themselves.
        language: ['rust', 'actions']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Install Rust
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
      with:
        toolchain: 1.99.1

    - name: Cache dependencies
      if: matrix.language == 'rust'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.99.1-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      if: matrix.language == 'rust'
      run: cargo build --locked --workspace --all-features

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
      with:
        category: "/language:${{matrix.language}}"
