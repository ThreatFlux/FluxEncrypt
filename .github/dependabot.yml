version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"

updates:
- package-ecosystem: cargo
  directory: /
  patterns: ["*"]
  multi-ecosystem-group: nightly-dependencies
  ignore:
  - dependency-name: pkcs8
    update-types: ["version-update:semver-major"]
  - dependency-name: sha2
    update-types: ["version-update:semver-major"]
  - dependency-name: rand
    update-types: ["version-update:semver-major"]

- package-ecosystem: github-actions
  directory: /
  patterns: ["*"]
  multi-ecosystem-group: nightly-dependencies

# Dockerfile (root) plus docker/Dockerfile and docker/Dockerfile.alpine.
- package-ecosystem: docker
  directories:
  - /
  - /docker
  patterns: ["*"]
  multi-ecosystem-group: nightly-dependencies
