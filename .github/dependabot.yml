version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: UTC
  open-pull-requests-limit: 10
  groups:
    rust-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - rust
  commit-message:
    prefix: "chore(deps)"

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: UTC
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
      - "*"
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: "chore(ci)"

  # Dockerfile (root) plus docker/Dockerfile and docker/Dockerfile.alpine.
- package-ecosystem: docker
  directories:
  - /
  - /docker
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: UTC
  open-pull-requests-limit: 3
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: "chore(docker)"
