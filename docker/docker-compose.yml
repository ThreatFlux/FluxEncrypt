# Run from the docker/ directory, e.g. `docker compose run --rm fluxencrypt --help`.
# The CLI exits after each command, so the services are not restarted.
services:
  fluxencrypt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: threatflux/fluxencrypt:latest
    container_name: fluxencrypt
    volumes:
    - ./data:/data
    - ./keys:/keys:ro
    environment:
    - RUST_LOG=info
    - FLUX_CONFIG_PATH=/data/config.toml
    command: ["--help"]
    restart: "no"

  fluxencrypt-alpine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.alpine
    image: threatflux/fluxencrypt:alpine
    container_name: fluxencrypt-alpine
    volumes:
    - ./data:/data
    - ./keys:/keys:ro
    environment:
    - RUST_LOG=info
    - FLUX_CONFIG_PATH=/data/config.toml
    command: ["--version"]
    restart: "no"
